<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cleand</title>
<meta name="theme-color" content="#EDF4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="cleand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF4F3; --surface:#FFFFFF; --surface-2:#DFEBE9; --ink:#10231F; --ink-2:#42585A; --ink-3:#687B7B; --line:#CFDEDB;
  --accent:#087A7F; --accent-hover:#06666A; --accent-ink:#FFFFFF; --accent-soft:#D5F0EE; --mint:#0F9E8F;
  --hero1:#075D63; --hero2:#0B8F94; --hero3:#14AAA6;
  --good:#1E7A4C; --good-soft:#DDF1E6; --danger:#B3261E; --danger-soft:#F9E3E1;
  --warm:#F6ECD6; --warm-ink:#5A4414;
  --shadow:0 1px 2px rgba(16,35,31,.06),0 6px 20px rgba(16,35,31,.06);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1514; --surface:#12201E; --surface-2:#1B2C29; --ink:#E2EFEC; --ink-2:#A2B7B3; --ink-3:#7C908C; --line:#253633;
    --accent:#4FD1CB; --accent-hover:#6FDDD8; --accent-ink:#06201F; --accent-soft:#16332F; --mint:#5EE0CF;
    --hero1:#063C40; --hero2:#07666A; --hero3:#0B7F7F;
    --good:#5CC592; --good-soft:#15301F; --danger:#F08A80; --danger-soft:#3A1D1B;
    --warm:#2E2716; --warm-ink:#EBD9AE; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1514; --surface:#12201E; --surface-2:#1B2C29; --ink:#E2EFEC; --ink-2:#A2B7B3; --ink-3:#7C908C; --line:#253633;
  --accent:#4FD1CB; --accent-hover:#6FDDD8; --accent-ink:#06201F; --accent-soft:#16332F; --mint:#5EE0CF;
  --hero1:#063C40; --hero2:#07666A; --hero3:#0B7F7F;
  --good:#5CC592; --good-soft:#15301F; --danger:#F08A80; --danger-soft:#3A1D1B;
  --warm:#2E2716; --warm-ink:#EBD9AE; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;min-width:0;text-align:left}
.mark{width:34px;height:34px;border-radius:10px;flex:none;position:relative;overflow:hidden;
  background-color:var(--accent);
  background-image:radial-gradient(circle at 24% 72%,rgba(255,255,255,.6) 0 1.6px,transparent 2px),radial-gradient(circle at 76% 80%,rgba(255,255,255,.5) 0 1.3px,transparent 1.7px),radial-gradient(circle at 80% 26%,rgba(255,255,255,.55) 0 1.1px,transparent 1.5px),radial-gradient(circle at 50% 54%,rgba(255,255,255,.35) 0 .9px,transparent 1.3px),linear-gradient(150deg,rgba(255,255,255,.18),rgba(255,255,255,0) 60%)}
.mark::before{content:"";position:absolute;left:7px;right:7px;top:10px;height:3px;border-radius:3px;background:rgba(255,255,255,.9)}
.mark::after{content:"";position:absolute;left:6px;top:8.5px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.topnav{display:flex;gap:4px}
.topnav button{border:0;background:none;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:36px}
.topnav button:hover{background:var(--surface-2)}
.topnav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
@media (max-width:480px){.sub{display:none!important}}
.word{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.035em;line-height:1}
.word b{color:var(--mint);font-weight:800}
.sub{font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.1;margin-top:2px;white-space:nowrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;font-weight:600;font-size:14px;white-space:nowrap;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.big{width:100%;min-height:54px;font-size:16.5px;font-weight:700;border-radius:16px}
.btn:disabled{opacity:.5;cursor:default}

/* Hero */
.hero{margin-top:16px;border-radius:22px;padding:22px 20px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2) 58%,var(--hero3));box-shadow:var(--shadow)}
.hero h1{font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.hero p{margin:8px 0 0;color:#E4F7F6;font-size:15px;max-width:48ch}

/* Section cards */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:12px;box-shadow:var(--shadow)}
.sec h2{font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:9px}
.sec h2 .n{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.lbl{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14.5px;font-weight:600;color:var(--ink-2);min-height:42px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.sm{padding:5px 11px;font-size:13px;min-height:32px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:11px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:46px;line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.timeline{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.timebig{font-family:var(--display);font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.timeline span{color:var(--ink-3);font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0 10px;height:28px}

/* Photos */
.pacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pact{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);min-height:92px;cursor:pointer;overflow:hidden}
.pact.main{background:var(--accent-soft);border-color:transparent}
.pact input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.pact svg{color:var(--accent)}
.pact b{font-size:15px}
.pact small{font-size:12.5px;color:var(--ink-3);line-height:1.3}
.pcount{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13.5px;color:var(--ink-2);font-weight:600}
.pcount .m{font-family:var(--mono);font-weight:500;color:var(--ink-3)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .no{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--mono);font-size:11px;border-radius:6px;padding:1px 6px}
.th .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.th.busy{display:grid;place-items:center}
.emptyp{margin-top:12px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--ink-3);font-size:14px}

textarea,.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.4}
textarea{resize:vertical;min-height:74px}
.hint{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.note{border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px}
.note.err{background:var(--danger-soft);color:var(--danger)}
.note.info{background:var(--surface-2);color:var(--ink-2)}
.go{margin-top:14px;padding-bottom:12px}
.go .alt{display:block;margin:8px auto 0;background:none;border:0;color:var(--ink-3);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}

.marea{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.marea:last-child{border-bottom:0}
.marea img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
.marea .f{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.marea .inp{padding:7px 10px;font-size:15px}
.marea select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:14px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Working */
.working{display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 16px;text-align:center;color:var(--ink-2)}
.working h2{font-size:22px;color:var(--ink)}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:360px}
.strip img{width:48px;height:48px;border-radius:9px;object-fit:cover;opacity:.9}

/* Plan */
.planhero{margin-top:16px;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(140deg,var(--hero1),var(--hero2) 70%);box-shadow:var(--shadow)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#AEE6E3}
.jobacts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.jobacts .btn.big{min-height:52px}
.jobacts .btn.primary:disabled{opacity:1;background:var(--surface-2);border-color:var(--surface-2);color:var(--ink-3)}
.donebanner{margin-top:14px;background:var(--good-soft);color:var(--good);border-radius:var(--r);padding:14px 16px;font-size:15px}
.donebanner b{display:block;font-family:var(--display);font-size:19px;margin-bottom:2px}
.bonus{font-size:11px;letter-spacing:.04em;background:#F2C14E;color:#3D2E05;border-radius:999px;padding:1px 8px}
.pill{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.open{background:var(--warm);color:var(--warm-ink)}
.goalpill{display:inline-flex;align-items:baseline;gap:8px;margin:12px 0 6px;background:rgba(255,255,255,.95);color:#07494D;border-radius:12px;padding:7px 12px;font-weight:700;font-size:15px;line-height:1.3;max-width:100%}
.goalpill span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0B8F94;font-weight:500;flex:none}
.restart{flex:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px;min-height:36px}
.planhero h1{font-size:clamp(26px,7vw,34px);font-weight:800;line-height:1.06;letter-spacing:-.03em;margin-top:6px}
.planhero p{margin:8px 0 0;color:#E4F7F6}
.clock{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.clock .t{font-family:var(--mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
.clock .k{font-size:12px;color:#CDEEEC;margin-top:3px}
.clock .btn{background:#fff;color:#07494D;border-color:#fff}
.clock.over{background:var(--warm);color:var(--warm-ink)}
.clock.over .k{color:inherit;opacity:.8}

.prog{margin-top:16px}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--mint));border-radius:999px;transition:width .25s}
.progline{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);font-weight:600;margin-top:6px}
.progline .m{font-family:var(--mono);font-weight:500;color:var(--ink-3)}

.tasks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 12px;cursor:pointer;box-shadow:var(--shadow)}
.task.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.task input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);margin-top:1px}
.task input:checked ~ .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task input:focus-visible ~ .box{outline:2px solid var(--accent);outline-offset:2px}
.tb{flex:1;min-width:0}
.tarea{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;display:flex;gap:8px;align-items:center}
.nowpill{font-size:11px;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px}
.ttitle{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.25;margin-top:2px}
.tact{color:var(--ink-2);font-size:15px;margin-top:4px}
.twhy{display:block;color:var(--ink-3);font-size:13px;margin-top:6px}
.tmin{flex:none;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-top:2px}
.task input:checked ~ .tb .ttitle,.task input:checked ~ .tb .tact{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.task input:checked ~ .tb .twhy{display:none}
.task input:checked ~ .tmin{opacity:.5}

.stop{margin-top:14px;background:var(--warm);color:var(--warm-ink);border-radius:var(--r);padding:14px 16px;font-size:15px}
.stop b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.extra{margin-top:10px;background:var(--good-soft);color:var(--good);border-radius:var(--r);padding:14px 16px;font-size:15px}
.extra b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
.saw{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
.saw summary{cursor:pointer;padding:12px 0;font-weight:700;font-family:var(--display);font-size:16px}
.sawrow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.sawrow img{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none}
.sawrow b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-bottom:40px}
.acts .btn{flex:1 1 140px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.copyout{width:100%;min-height:220px;font-family:var(--mono);font-size:13px}

/* After photos */
.after{margin-top:14px}
.after h2{font-size:19px;font-weight:700}
.after .pacts{margin-top:12px}
.after.lit{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.th button.open{all:unset;cursor:zoom-in;display:block;width:100%;height:100%}

/* Wins */
.winshead{margin-top:18px}
.winshead h1{font-size:clamp(28px,7vw,38px);font-weight:800;letter-spacing:-.03em}
.winshead p{color:var(--ink-3);margin:4px 0 0}
.win{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.winmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink-3);font-family:var(--mono)}
.win h3{font-size:19px;font-weight:700;margin-top:4px}
.slidebtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.slidebtns button{width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.bahead .rn select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:15px;color:var(--ink);padding:0 16px 0 0;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:right 4px center,right 0 center;background-size:4px 4px;background-repeat:no-repeat}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bahead .sbs{border:0;background:none;color:var(--accent);font-weight:700;font-size:12.5px;padding:0}
.ba .swipe{text-align:center;font-size:12px;color:var(--accent);font-weight:700;margin-top:4px}
.unm{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.unm .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-3);margin-bottom:8px}
.unrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.unrow .open{all:unset;cursor:zoom-in;flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.unrow img{width:100%;height:100%;object-fit:cover;display:block}
.unchips{display:flex;flex-wrap:wrap;gap:6px}
.winsec{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:30px 2px 0}
.afterbar{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--surface-2);border-radius:12px;padding:6px 8px}
.afterbar img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none}
.afterbar>span{font-size:13px;font-weight:700;color:var(--ink-2);flex:none}

const GOAL_TEXT={
  quick:`QUICK WIN. The person needs momentum and a visible "I did something" moment.
  - Pick the 2-5 smallest steps with the most obvious visual change: the thing you see first when you walk in.
  - Each step should be finishable in a few minutes with zero decisions (trash out, one surface cleared, blanket pulled up).
  - Front-load the fastest, most satisfying step as step 1.

  - Example step: "Clear the coffee table: trash in the bag, cups to the sink, everything else in one basket."`,
  declutter:`DECLUTTER & DONATE. The goal is FEWER THINGS in the house: get stuff off floors and surfaces, out of the room, and set aside anything that can be donated.
  - Start the plan by having them grab two bags or boxes: one for trash, one for DONATE.
  - Removing steps: trash and recycling out, dishes to the kitchen, laundry to the hamper, things that belong in other rooms carried out.
  - Donate steps: point to specific things in the photos that look like easy donations (outgrown kids' clothes or shoes, toys nobody plays with, duplicates, décor or items that look unused). Use a quick rule: "if you didn't know you had it or haven't used it this year, it goes in the donate bag." Keep decisions fast and yes/no. Nothing sentimental.

  organize:`ORGANIZATION. The goal is things IN THEIR PLACE and grouped, not just gone.
  - Steps are about returning items to their homes and grouping like with like: shoes together at the door, toys back in their bin, books on the shelf, cords coiled, papers in one stack.
  - Create simple zones where there clearly are none (one spot for bags, one for keys and mail).
  - Name WHERE each group of things goes, based on storage you can see in the photos.
  - Sorting into a few broad groups IS the job here, but no drawer organizing, micro-sorting, labeling or buying storage.
  - Example step: "Group the toys: stuffed animals on the bed, building toys in the white bin, books on the bottom shelf."`,
  maid:`PREPARE FOR MAID. Ermalinda, the house cleaner, is coming. The goal is to clear the way so she spends her paid time CLEANING, not moving the family's stuff. The person does the pickup; Ermalinda does the cleaning.
  - What Ermalinda does: she cleans, does the dishes, changes the sheets, and washes laundry but does NOT put it away. Anything left out, she may move to a random spot, so it gets lost.
  - Dishes: she washes them, so don't have the person do dishes or load the dishwasher. Just gather every dish, cup and bottle from around the house to the kitchen and stack them neatly by the sink, food scraped into the trash.
  - Beds: she changes the sheets, so beds must be completely clear: pillows, stuffed animals, clothes, books, devices and blankets that aren't bedding off the bed and put where they belong.
  - So every loose item must go to its real home (or, only if there's truly no time, into ONE clearly marked "hold" basket tucked in a closet). Never tell them to leave piles out for later.
  - Laundry: dirty clothes into hampers or the laundry room so she can wash them. Clean, folded laundry she already did should get put away, so drawers and surfaces are clear for the next batch.
  - Clear flat surfaces she will wipe: kitchen counters (everything but the stacked dishes), dining and coffee tables, nightstands, dressers, bathroom counters and tubs (toiletries grouped or put away).
  - Clear floors she will vacuum and mop: toys, shoes, bags, cords, clothes.
  - Do NOT include wiping, scrubbing, vacuuming, mopping or other cleaning. That is her job. This plan is pickup and put-away only.
  - Order: rooms with the most loose items on floors and surfaces first, then counters, then small finishing touches.
  - Example step: "Kids' room floor: toys into the bins, clothes into the hamper, shoes to the closet. Nothing left on the floor for Ermalinda to move."`,
  impact:`BIGGEST IMPACT. The goal is the biggest overall difference in how the space looks and works when time runs out.
  - Go after the largest, most visible problem areas first (floors and main surfaces), even if those steps are longer.
  - Restore the main function of each room shown (can walk through, sit, sleep, cook).
  - Mix removing and putting away as needed. Skip small details entirely.
  - Example step: "Clear the whole bedroom floor: dirty clothes to the hamper, trash to the bag, everything else on the bed to put away next."`
};

/* ---------- persistence ----------

let saveT=null;
function savePlan(){
  if(!S.db)return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    const cur=S.db.doc("session/current");
    if(!S.plan){cur.delete().catch(()=>{});return}

const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACw=";
const urlCache={},loading={};let reT=null;
function blobUrl(id){
  if(urlCache[id])return urlCache[id];

async function uploadBlob(blob){

  if(!S.assets||!areas.length)return;
  plan.before=plan.before||[];
  for(let i=0;i<areas.length;i++){
    if(S.plan!==plan)return;

// After photos: works for the current plan or any past reset in Wins.
/* Pair each after photo with its before photo (by photo number). Afters with no area stay unmatched until assigned. */
function pairsFor(w,after){
  const before=(w.before||[]).slice().sort((a,b)=>a.photo-b.photo);
  const pairs=before.map(b=>{const m=after.filter(x=>x.photo===b.photo);return {b,a:m.length?m[m.length-1]:null}});

  if(!confirm("Remove this after photo? The before photo stays."))return;

async function assignAfter(planId,afterId,photo){
  const {isCur,t}=winTarget(planId);if(!t)return;

/* Saving photos out of the app: share sheet on iPhone (Save Image to Photos), download elsewhere. */
const localDay=iso=>{const d=new Date(iso||Date.now());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"area";
async function shareFiles(files){
  if(!files.length){toast("No photos to save");return}
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e&&e.name==="AbortError")return}

async function fileFor(id,name){const b=S.assets&&await S.assets.get(id);return b?new File([b],name,{type:b.type||"image/jpeg"}):null}

/* ---------- photos ---------- */
function prepareImage(file){
  // Downsize to a JPEG blob. If Safari can show it but can't re-encode it, keep the original file.
  return new Promise(resolve=>{
    const src=URL.createObjectURL(file);
    const im=new Image();
    const keep=()=>{URL.revokeObjectURL(src);resolve(file)};
    im.onload=()=>{
      try{
        let w=im.naturalWidth,h=im.naturalHeight;
        if(!w||!h)return keep();
        const sc=Math.min(1,1600/Math.max(w,h));w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const x=c.getContext("2d");if(!x)return keep();
        x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
        c.toBlob(b=>{URL.revokeObjectURL(src);resolve(b&&b.size>500?b:file)},"image/jpeg",.85);
      }catch(e){keep()}
    };
    im.onerror=keep;
    im.src=src;
  });
}
async function addFiles(list,input){
  const files=[...(list||[])];
  if(input)input.value=""; // reset now so the camera can be used again right away, even if iOS reuses a filename
  if(!files.length)return;
  const room=MAX_PHOTOS-S.areas.length-S.adding;
  if(room<=0){toast(`Up to ${MAX_PHOTOS} photos. Remove one to add another.`);return}
  const take=files.slice(0,room);
  if(files.length>room)toast(`Added the first ${room}. The limit is ${MAX_PHOTOS} photos.`);
  S.adding+=take.length;render();
  for(const f of take){
    try{
      const blob=await prepareImage(f);
      S.areas.push({id:uid(),name:"",blob,url:URL.createObjectURL(blob),analysis:null});
    }catch(e){console.error(e);toast("Couldn't add that photo. Try taking it again.")}
    S.adding--;render();
  }
}
function removeArea(id){

// When there are more photos than one call can carry, tile them into labeled collages.
async function imagesForCall(){
  const n=S.areas.length,max=Math.max(1,S.imgMax);
  if(n<=max)return {blobs:S.areas.map(a=>a.blob),collage:false};
  const per=Math.ceil(n/max),groups=[];
  for(let i=0;i<n;i+=per)groups.push(S.areas.slice(i,i+per).map((a,j)=>({a,no:i+j+1})));
  const out=[];
  for(const g of groups){
    const cols=g.length<=2?g.length:Math.ceil(Math.sqrt(g.length)),rows=Math.ceil(g.length/cols),cell=900,gap=12;
    const c=document.createElement("canvas");c.width=cols*cell+(cols-1)*gap;c.height=rows*cell+(rows-1)*gap;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
    for(let k=0;k<g.length;k++){
      const im=await loadImg(g[k].a.url);const cx=(k%cols)*(cell+gap),cy=Math.floor(k/cols)*(cell+gap);
      if(im){const s=Math.max(cell/im.naturalWidth,cell/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
        x.save();x.beginPath();x.rect(cx,cy,cell,cell);x.clip();x.drawImage(im,cx+(cell-w)/2,cy+(cell-h)/2,w,h);x.restore()}
      x.fillStyle="rgba(0,0,0,.72)";x.fillRect(cx+14,cy+14,250,72);x.fillStyle="#fff";x.font="bold 48px sans-serif";x.textBaseline="middle";x.fillText("Photo "+g[k].no,cx+30,cy+51);
    }
    const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));if(b)out.push(b);
  }
  return {blobs:out,collage:true};
}
function loadImg(url){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url})}

function workMs(p){p=p||S.plan;if(!p)return 0;return (p.elapsedMs||0)+(p.startedAt?Date.now()-new Date(p.startedAt).getTime():0)}
function remainingMs(){if(!S.plan||(!S.plan.startedAt&&!S.plan.elapsedMs))return null;return S.plan.minutes*60000-workMs()}

  if(r<=0)return `<div class="clock over"><div><div class="t">Time's up</div><div class="k">Stop here. A partially reset house is still a reset.</div></div></div>`;
  const s=Math.ceil(r/1000),mm=Math.floor(s/60),ss=String(s%60).padStart(2,"0");
  if(!p.startedAt)return `<div class="clock"><div><div class="t">${mm}:${ss}</div><div class="k">Paused · left of ${p.minutes} minutes</div></div><button class="btn" data-act="clock">Resume clock</button></div>`;

/* Learning: time each checked step against its estimate while the clock runs. */
function getSamples(){try{return JSON.parse(localStorage.getItem("cleand_timing")||"[]")}catch(e){return []}}
function addSample(x){const a=getSamples();a.push(x);try{localStorage.setItem("cleand_timing",JSON.stringify(a.slice(-80)))}catch(e){}}
function timeFactor(){
  const a=getSamples().filter(x=>x.e>0&&x.a>0);if(a.length<3)return null;
  const r=a.map(x=>x.a/x.e).sort((x,y)=>x-y),m=r[Math.floor(r.length/2)];
  return {f:Math.min(2.5,Math.max(0.5,m)),n:a.length,ex:a.slice(-6)};
}
function calibrationText(){
  const t=timeFactor();if(!t)return "";
  const pct=Math.round(t.f*100);
  return `\nTIME CALIBRATION (learned from ${t.n} timed steps this person actually did): their steps take about ${pct}% of the minutes estimated before. Scale your minute estimates to match. Recent examples: ${t.ex.map(x=>`"${x.t}" estimated ${x.e} min, took ${x.a} min`).join("; ")}.`;
}

    if(act>=0.5&&act<=t.minutes*4+10)addSample({e:t.minutes,a:act,t:t.title.slice(0,40)})}}

}

function confetti(){

  const c=document.createElement("canvas"),dpr=Math.min(2,devicePixelRatio||1);
  c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95";
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;document.body.appendChild(c);
  const x=c.getContext("2d");x.scale(dpr,dpr);
  const cols=["#0B8F94","#5EE0CF","#F2C14E","#FF7A6B","#FFFFFF","#7C9CFF","#14AAA6"];
  const P=Array.from({length:170},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.6,w:6+Math.random()*6,h:8+Math.random()*8,vy:2.2+Math.random()*3.2,vx:-1.2+Math.random()*2.4,r:Math.random()*6.28,vr:-.2+Math.random()*.4,c:cols[Math.floor(Math.random()*cols.length)],s:Math.random()*6.28}));
  const t0=performance.now();
  (function f(t){const el=t-t0;x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.y+=p.vy;p.x+=p.vx+Math.sin((el/400)+p.s)*.8;p.r+=p.vr;x.save();x.globalAlpha=el>3000?Math.max(0,1-(el-3000)/900):1;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(el/200+p.s)));x.restore()}
    if(el<3900)requestAnimationFrame(f);else c.remove()})(t0);
}

  }).join("")+`<div style="height:40px"></div>`;

function renderPlanParts(){

/* ---------- Gemini (stands in for the photo-reading call) ---------- */
const MODELS=["gemini-3.5-flash","gemini-3.8-flash","gemini-flash-latest","gemini-2.5-flash"];
const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
function parseJSONLoose(t){
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/),body=f?f[1]:t,a=body.indexOf("{"),b=body.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(body.slice(a,b+1))}catch(e){}}
  throw {code:"invalid_json"};
}
/* Photos for AI: smaller is much faster to upload and Gemini doesn't need more detail. */
function shrinkForAI(blob,max=1024,q=.72){
  return new Promise(res=>{const u=URL.createObjectURL(blob),im=new Image();
    im.onload=()=>{try{const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      c.toBlob(b=>{URL.revokeObjectURL(u);res(b&&b.size>500?b:blob)},"image/jpeg",q)}catch(e){URL.revokeObjectURL(u);res(blob)}};
    im.onerror=()=>{URL.revokeObjectURL(u);res(blob)};im.src=u});
}
const AI_TIMEOUT_MS=100000;
async function geminiJSON(prompt,opts={}){
  const key=getKey();if(!key)throw {code:"bad_key"};
  const stage=t=>{S.stage=t;const el=document.getElementById("stage");if(el)el.textContent=t};
  const parts=[{text:prompt}],imgs=opts.images||[];
  if(imgs.length)stage("Shrinking photos…");
  for(const b of imgs){const sb=await shrinkForAI(b);parts.push({inline_data:{mime_type:"image/jpeg",data:await toB64(sb)}})}
  if(opts.signal&&opts.signal.aborted)throw {code:"cancelled"};
  stage(imgs.length?`Gemini is looking at ${imgs.length} photo${imgs.length>1?"s":""}…`:"Asking Gemini…");
  const ctl=new AbortController();let timedOut=false;
  const onAbort=()=>ctl.abort();if(opts.signal)opts.signal.addEventListener("abort",onAbort);
  const timer=setTimeout(()=>{timedOut=true;ctl.abort()},AI_TIMEOUT_MS);
  try{return await geminiCall(key,parts,{...opts,signal:ctl.signal},stage)}
  catch(e){if(timedOut)throw {code:"timeout"};throw e}
  finally{clearTimeout(timer);if(opts.signal)opts.signal.removeEventListener("abort",onAbort)}
}
async function geminiCall(key,parts,opts,stage){
  const body=JSON.stringify({contents:[{role:"user",parts}],generationConfig:{responseMimeType:"application/json",temperature:0.4}});
  let saved="";try{saved=localStorage.getItem("cleand_model")||""}catch(e){}
  const list=[...new Set([saved,...MODELS].filter(Boolean))];
  let last=null;
  for(const m of list){
    let r;
    try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body,signal:opts.signal});stage("Gemini is building your plan…")}
    catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};if(navigator.onLine===false)throw {code:"offline"};last={code:"upstream_error",message:"Network error ("+(e&&e.message||e)+") on "+m};continue}
    if(r.status===404)continue;
    let j=null;try{j=await r.json()}catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"}}
    const msg=(j&&j.error&&j.error.message)||"";
    if(r.status===400&&/not found|not supported|unknown model/i.test(msg))continue;
    if(r.status===400&&/api key/i.test(msg)||r.status===401||r.status===403)throw {code:"bad_key"};
    if(r.status===429)throw {code:"rate_limited"};
    if(r.status===413)throw {code:"too_large"};
    if(r.status>=500){last={code:"upstream_error",message:r.status+" "+msg+" ("+m+")"};continue}
    if(!r.ok)throw {code:"upstream_error",message:r.status+" "+msg+" ("+m+")"};
    try{localStorage.setItem("cleand_model",m)}catch(e){}
    const c=j&&j.candidates&&j.candidates[0];
    if(!c||(j.promptFeedback&&j.promptFeedback.blockReason)||c.finishReason==="SAFETY")throw {code:"refused"};
    const text=((c.content&&c.content.parts)||[]).map(p=>p.text||"").join("");
    if(!text.trim())throw {code:"invalid_json"};
    return parseJSONLoose(text);
  }
  throw last||{code:"no_model"};
}

/* ---------- on-device storage (IndexedDB) ---------- */
function openIDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const q=indexedDB.open("cleand",1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore("docs");d.createObjectStore("blobs")};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function idbReq(d,store,mode,fn){return new Promise((res,rej)=>{const tx=d.transaction(store,mode),st=tx.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};tx.oncomplete=()=>res(out);tx.onerror=tx.onabort=()=>rej(tx.error)})}
function makeLocalStore(d){
  const listeners=[];
  async function fire(){
    if(!listeners.length)return;
    const all=await idbReq(d,"docs","readonly",st=>st.getAll(IDBKeyRange.bound("resets/","resets/￿")));
    const docs=(all||[]).sort((a,b)=>(a.createdAt<b.createdAt?1:-1)).slice(0,200).map(v=>({id:v.id,exists:true,data:()=>JSON.parse(JSON.stringify(v))}));
    listeners.forEach(f=>f({docs,size:docs.length,empty:!docs.length}));
  }
  const db={
    doc:p=>({
      get:async()=>{const v=await idbReq(d,"docs","readonly",st=>st.get(p));return {id:p.split("/").pop(),exists:v!==undefined,data:()=>v===undefined?undefined:JSON.parse(JSON.stringify(v))}},
      set:async v=>{await idbReq(d,"docs","readwrite",st=>st.put(JSON.parse(JSON.stringify(v)),p));if(p.startsWith("resets/"))fire()},
      delete:async()=>{await idbReq(d,"docs","readwrite",st=>st.delete(p));if(p.startsWith("resets/"))fire()}
    }),
    collection:()=>{const q={orderBy:()=>q,limit:()=>q,onSnapshot:(f,err)=>{listeners.push(f);fire().catch(e=>err&&err(e));return()=>{}}};return q}
  };
  const assets={
    upload:async blob=>{const id=uid().replace(/-/g,"");await idbReq(d,"blobs","readwrite",st=>st.put(blob,id));return {id}},
    get:id=>idbReq(d,"blobs","readonly",st=>st.get(id)).catch(()=>null),
    delete:async id=>{await idbReq(d,"blobs","readwrite",st=>st.delete(id));return {deleted:true}}
  };
  return {db,assets};
}

/* ---------- boot ---------- */
render();
(async function boot(){
  S.sample={json:geminiJSON};S.canImages=true;S.imgMax=10;
  try{const d=await openIDB();const st=makeLocalStore(d);S.db=st.db;S.assets=st.assets;
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){console.warn("no local storage",e)}
  const db=S.db;
  if(db){try{const s=await db.doc("session/current").get();const d=s.exists?s.data():null;
    let plan=null;if(d&&d.planId){const r=await db.doc("resets/"+d.planId).get();if(r.exists)plan=r.data()}
    if(plan&&Array.isArray(plan.tasks)&&!S.plan&&!S.busy){S.plan=plan;S.plan.before=S.plan.before||[];S.plan.after=S.plan.after||[];
      const age=Date.now()-new Date(S.plan.createdAt).getTime();
      if(age<12*3600e3&&!S.areas.length)S.view="plan";
    }}catch(e){console.warn(e)}
    db.collection("resets").orderBy("createdAt","desc").limit(200).onSnapshot(snap=>{
      S.wins=snap.docs.map(d=>({id:d.id,...d.data()}));S.winsReady=true;if(S.view==="wins"&&!S.busy)render();
    },e=>{console.warn(e);S.winsReady=true;if(S.view==="wins")render()});
  }
  S.runtimeChecked=true;render();
})();
